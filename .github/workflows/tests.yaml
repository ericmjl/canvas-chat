name: Tests

on:
  push:
    branches:
      - main
    paths:
      - "src/**"
      - "tests/**"
      - "pyproject.toml"
      - ".github/workflows/tests.yaml"
  pull_request:
    branches:
      - main
    paths:
      - "src/**"
      - "tests/**"
      - "pyproject.toml"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/tests.yaml"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  bdd-enforcement:
    name: BDD enforcement
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install pixi
        uses: prefix-dev/setup-pixi@v0.9.3

      - name: Install npm dependencies
        run: npm ci

      - name: Generate features from stories
        run: node scripts/generate_features.js

      - name: Detect missing step definitions
        run: node scripts/generate_step_stubs.js

      - name: Ensure generated outputs are committed
        run: git diff --exit-code

      - name: Fetch base branch for test enforcement
        if: github.event_name == 'pull_request'
        run: git fetch origin ${{ github.base_ref }} --depth=1

      - name: Enforce tests on code changes
        if: github.event_name == 'pull_request'
        run: node scripts/check_tests_present.js

  python-tests:
    name: Python tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install uv
        uses: astral-sh/setup-uv@v7

      - name: Install dependencies
        run: uv pip install --system -e ".[dev]"

      - name: Run Python tests
        run: pytest tests/ -v --color=yes

  javascript-tests:
    name: JavaScript tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Install pixi
        uses: prefix-dev/setup-pixi@v0.9.4

      - name: Install npm dependencies
        run: pixi run npm install

      - name: Run JavaScript tests
        run: pixi run test-js
