    #     retriever:
    #       id: retriever
    #       name: Information Retriever
    #       model: openai/gpt-4o-mini
    #       systemPrompt: You retrieve and filter relevant information.
    #       allowedTools:
    #         - web_search
    #         - fetch_url
    #       budgets:
    #         maxTokens: 30000
    #         maxToolCalls: 15
    #         timeoutMs: 120000
