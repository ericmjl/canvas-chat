# ============================================================================
# MCP SERVERS - Model Context Protocol tool providers
# ============================================================================
#
# Optional. Connect to MCP servers for external tool capabilities.
# MCP (Model Context Protocol) defines a standard interface for tools.
#
# Tools from MCP servers are automatically registered in the ToolRegistry
# and can be referenced in agent allowedTools using the format:
#   mcp:server-name/tool-name
#
# For example, if you configure a server named "git", its tools become:
#   - mcp:git/git_status
#   - mcp:git/git_log
#   etc.
#
# See the "git-assistant" agent example above for usage in agents.
#
# Server types:
# - stdio: Local process communicating via stdin/stdout (most common)
# - http: Remote HTTP endpoint (for cloud-hosted tools)
# - ws: WebSocket connection (for real-time tools)

mcpServers:
    # Example 1: Local filesystem tools via stdio
    # - name: filesystem
    #   type: stdio
    #   command: npx
    #   args:
    #     - -y
    #     - "@modelcontextprotocol/server-filesystem"
    #     - "/path/to/allowed/directory"
    #   tools:
    #     - read_file
    #     - write_file
    #     - list_directory

    # Example 2: Git tools via stdio
    # - name: git
    #   type: stdio
    #   command: uvx
    #   args:
    #     - mcp-server-git
    #     - "--repository"
    #     - "."
    #   tools:
    #     - "*"  # Allow all tools from this server

    # Example 3: Remote HTTP MCP server
    # - name: cloud-tools
    #   type: http
    #   url: https://mcp.example.com/api
    #   headers:
    #     Authorization: Bearer ${MCP_API_KEY}
    #   tools:
    #     - web_search
    #     - fetch_url

    # Example 4: Custom Python MCP server
    # - name: custom-tools
    #   type: stdio
    #   command: python
    #   args:
    #     - -m
    #     - my_mcp_server
    #   env:
    #     MY_API_KEY: ${MY_API_KEY}
    #   tools:
    #     - custom_tool_1
    #     - custom_tool_2

    # Example 5: Brave search MCP server
    # - name: brave-search
    #   type: stdio
    #   command: npx
    #   args:
    #     - -y
    #     - "@anthropics/mcp-server-brave-search"
    #   env:
    #     BRAVE_API_KEY: ${BRAVE_API_KEY}
    #   tools:
    #     - brave_search

# ============================================================================
# BUILT-IN TOOLS - Tools provided by Canvas Chat
# ============================================================================
#
# These tools are always available and don't require MCP server configuration:
#
# - web_search: Search the web using Exa API (requires EXA_API_KEY)
# - fetch_url: Fetch and extract content from URLs
# - read_file: Read file contents (within allowed directories)
# - execute_code: Execute code in Pyodide sandbox
# - transform_text: Transform text (uppercase, lowercase, trim, etc.)
# - text_analysis: Analyze text for sentiment, entities, key phrases
# - calculator: Perform mathematical calculations
#
# Plugins can register additional tools via the ToolRegistry.
# See example-mcp-tool-plugin.js for how to add custom tools.

# ============================================================================
# GUARDRAILS - Safety limits for agent execution
# ============================================================================
#
# Optional. Global safety limits that apply to all agent executions.

guardrails:
    maxSubagentDepth: 1          # Maximum sub-agent nesting (default: 1)
    maxSubagentSpawnsPerRun: 5   # Maximum sub-agents per run (default: 5)
    inheritBudgets: true          # Sub-agents inherit parent budgets (default: true)
    debounceTriggerMs: 500        # Debounce for node-triggered runs (default: 500)

# ============================================================================
# MEMORY STORE - Long-horizon memory configuration
# ============================================================================
#
# Optional. Configure memory storage for retain/recall/reflect operations.
# Memory enables agents to remember past interactions and learned facts.
#
# Store types:
# - in-memory: Simple in-memory store (default, lost on restart)
# - postgres: PostgreSQL with pgvector for semantic search (future)
# - dag: Store memories as nodes in the DAG (future)

memoryStore:
    type: in-memory
    # connectionStringEnvVar: DATABASE_URL  # For postgres type
    policy:
        enabled: true
        defaultBankId: default
        maxMemoriesPerBank: 1000
        # ttlDays: 30  # Optional: Auto-expire memories
        allowedTypes:
            - world       # Facts about entities, relationships
            - experience  # What happened, events, outcomes
            - opinion     # Beliefs, preferences, assessments

# ============================================================================
# BLOB STORE - Pluggable binary object storage
# ============================================================================
#
# Optional. Configure where large binary objects (images, files, etc.) are stored.
# Blob storage is separate from the DAG to keep node data lightweight.
#
# Backend types:
# - local: Local filesystem (default)
# - s3: Amazon S3 or S3-compatible storage (MinIO, DigitalOcean Spaces, etc.)
# - gcs: Google Cloud Storage (future)
# - azure: Azure Blob Storage (future)
#
# Each backend can be registered via plugins for maximum flexibility.

blobStore:
    # Default: Local filesystem storage
    type: local
    config:
        storageDir: ~/.canvas-chat/blobs  # Where to store blobs

    # Example: AWS S3 backend
    # type: s3
    # config:
    #   bucket: my-canvas-chat-blobs
    #   region: us-west-2
    #   # Credentials from environment: AWS_ACCESS_KEY_ID, AWS_SECRET_ACCESS_KEY
    #   # Or specify explicit credential env vars:
    #   accessKeyEnvVar: AWS_ACCESS_KEY_ID
    #   secretKeyEnvVar: AWS_SECRET_ACCESS_KEY
    #   # Optional: custom endpoint for S3-compatible services
    #   endpointEnvVar: S3_ENDPOINT_URL  # e.g., for MinIO or DigitalOcean Spaces

    # Example: MinIO (S3-compatible)
    # type: s3
    # config:
    #   bucket: canvas-chat
    #   region: us-east-1
    #   endpointEnvVar: MINIO_ENDPOINT  # http://localhost:9000
    #   accessKeyEnvVar: MINIO_ACCESS_KEY
    #   secretKeyEnvVar: MINIO_SECRET_KEY

    # Example: Google Cloud Storage (future)
    # type: gcs
    # config:
    #   bucket: my-canvas-chat-blobs
    #   projectId: my-gcp-project
    #   credentialsEnvVar: GOOGLE_APPLICATION_CREDENTIALS

    # Example: Azure Blob Storage (future)
    # type: azure
    # config:
    #   containerName: canvas-chat-blobs
    #   accountNameEnvVar: AZURE_STORAGE_ACCOUNT
    #   accountKeyEnvVar: AZURE_STORAGE_KEY

# ============================================================================
# FIELD REFERENCE
# ============================================================================
#
# models (required, array):
#   - id (required, string): LiteLLM-compatible model identifier
#       Format: provider/model-name
#       Examples: "openai/gpt-4o", "anthropic/claude-3-5-sonnet-20241022"
#
#   - name (required, string): Display name shown in UI
#
#   - apiKeyEnvVar (optional in normal mode, required in admin mode, string):
#       Environment variable name containing API key
#       In admin mode: The actual key value is read from the environment at runtime
#       In normal mode: Can be omitted; users provide keys via UI
#
#   - contextWindow (optional, integer): Token limit for context building
#       Default: 128000
#
#   - endpointEnvVar (optional, string): Environment variable for custom API endpoint
#       Used for self-hosted models (Ollama, vLLM) or Azure deployments
#
# plugins (optional, array):
#   Format 1 (JavaScript-only):
#     - path (string): Path to plugin JavaScript file
#       OR
#     - js (string): Path to plugin JavaScript file
#
#   Format 2 (Python-only):
#     - py (string): Path to plugin Python file
#
#   Format 3 (Paired):
#     - id (string): Unique plugin identifier
#     - js (string): Path to plugin JavaScript file
#     - py (string): Path to plugin Python file
#
#   Paths can be absolute or relative to this config file.
#   JavaScript plugins must be ES modules that import from '/static/js/'
#   Python plugins must extend plugin base classes (e.g., UrlFetchHandlerPlugin)
#
# ============================================================================
# ENVIRONMENT VARIABLES
# ============================================================================
#
# Set these environment variables before starting canvas-chat in admin mode:
#
# # Required for each model (admin mode only)
# export OPENAI_API_KEY="sk-..."
# export ANTHROPIC_API_KEY="sk-ant-..."
# export GEMINI_API_KEY="..."
# export GROQ_API_KEY="gsk_..."
#
# # Optional: Custom endpoints
# export OLLAMA_BASE_URL="http://localhost:11434"
# export AZURE_OPENAI_ENDPOINT="https://your-resource.openai.azure.com/"
#
# # Optional: Exa API for research features
# export EXA_API_KEY="your-exa-api-key"
#
# Then run:
#   # Normal mode (users provide keys):
#   uvx canvas-chat launch --config config.yaml
#
#   # Admin mode (server-side keys):
#   uvx canvas-chat launch --config config.yaml --admin-mode
#
# ============================================================================
# SECURITY NOTES
# ============================================================================
#
# 1. NEVER commit API keys to this file
# 2. Use environment variables for all secrets
# 3. Set appropriate file permissions: chmod 600 config.yaml
# 4. Add config.yaml to .gitignore (but commit config.example.yaml)
# 5. Use different environment variables for dev/test/prod
#
# See documentation for more details on deployment and plugin development.
