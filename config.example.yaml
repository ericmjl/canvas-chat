# Canvas Chat Configuration Example
#
# This file demonstrates the configuration schema for canvas-chat.
# Copy this file to `config.yaml` and customize it for your deployment.
#
# Two modes of operation:
#
# 1. Normal mode (users provide their own API keys via UI):
#    uvx canvas-chat launch --config config.yaml
#    - Pre-populates model list (users don't need to add models manually)
#    - Plugins work
#    - Users provide their own API keys in the settings UI
#    - apiKeyEnvVar is optional (can be omitted)
#
# 2. Admin mode (server-side API keys, locked down):
#    uvx canvas-chat launch --config config.yaml --admin-mode
#    - Server-side API key management (users don't provide their own keys)
#    - Settings UI is hidden
#    - apiKeyEnvVar is required for each model
#    - Plugins work
#
# IMPORTANT: This file should be committed to version control.
# API keys and endpoints should be set via environment variables, NOT in this file.
# This allows the same config.yaml to work across dev/test/prod environments.

# ============================================================================
# MODELS - Define LLM providers and models available to users
# ============================================================================
#
# At least one model must be configured.
#
# In admin mode: apiKeyEnvVar is required (server-side keys)
# In normal mode: apiKeyEnvVar is optional (users provide keys via UI)

models:
    # OpenAI models
    - id: 'openai/gpt-4o'
      name: 'GPT-4o'
      apiKeyEnvVar: 'OPENAI_API_KEY'
      contextWindow: 128000

    - id: 'openai/gpt-4o-mini'
      name: 'GPT-4o Mini'
      apiKeyEnvVar: 'OPENAI_API_KEY'
      contextWindow: 128000

    - id: 'openai/o1'
      name: 'O1'
      apiKeyEnvVar: 'OPENAI_API_KEY'
      contextWindow: 200000

    # Anthropic models (direct via API key or via LiteLLM proxy)
    - id: 'anthropic/claude-sonnet-4-20250514'
      name: 'Claude Sonnet 4'
      apiKeyEnvVar: 'ANTHROPIC_API_KEY'
      contextWindow: 200000

    - id: 'anthropic/claude-3-5-haiku-20241022'
      name: 'Claude 3.5 Haiku'
      apiKeyEnvVar: 'ANTHROPIC_API_KEY'
      contextWindow: 200000

    # Google models (direct via API key or via LiteLLM proxy)
    - id: 'gemini/gemini-1.5-pro'
      name: 'Gemini 1.5 Pro'
      apiKeyEnvVar: 'GEMINI_API_KEY'
      contextWindow: 2000000

    # Groq models (fast inference)
    - id: 'groq/llama-3.1-70b-versatile'
      name: 'Llama 3.1 70B (Groq)'
      apiKeyEnvVar: 'GROQ_API_KEY'
      contextWindow: 128000

    # Example: LiteLLM proxy (Anthropic / Gemini / Grok)
    # Set LITELLM_BASE_URL=http://localhost:4000 and configure provider keys in LiteLLM.
    # - id: 'anthropic/claude-3-5-sonnet-20241022'
    #   name: 'Claude 3.5 Sonnet (LiteLLM)'
    #   apiKeyEnvVar: 'LITELLM_API_KEY'
    #   endpointEnvVar: 'LITELLM_BASE_URL'
    #   contextWindow: 200000
    #
    # - id: 'gemini/gemini-1.5-pro'
    #   name: 'Gemini 1.5 Pro (LiteLLM)'
    #   apiKeyEnvVar: 'LITELLM_API_KEY'
    #   endpointEnvVar: 'LITELLM_BASE_URL'
    #   contextWindow: 2000000
    #
    # - id: 'xai/grok-2'
    #   name: 'Grok 2 (LiteLLM)'
    #   apiKeyEnvVar: 'LITELLM_API_KEY'
    #   endpointEnvVar: 'LITELLM_BASE_URL'
    #   contextWindow: 128000

    # Example: Local Ollama model
    # - id: "ollama/llama3.2"
    #   name: "Llama 3.2 (Local)"
    #   apiKeyEnvVar: "OLLAMA_API_KEY"  # Can be a dummy value like "ollama"
    #   endpointEnvVar: "OLLAMA_BASE_URL"  # Set to http://localhost:11434
    #   contextWindow: 128000

    # Example: Custom Azure OpenAI deployment
    # - id: "azure/gpt-4-turbo"
    #   name: "GPT-4 Turbo (Azure)"
    #   apiKeyEnvVar: "AZURE_OPENAI_API_KEY"
    #   endpointEnvVar: "AZURE_OPENAI_ENDPOINT"
    #   contextWindow: 128000

# ============================================================================
# PLUGINS - Extend canvas-chat with custom features
# ============================================================================
#
# Optional. Plugins can be JavaScript (.js), Python (.py), or both (paired).
# Paths can be absolute or relative to this config file.
# Plugins work in both normal and admin mode.
#
# Plugin formats:
#   1. JavaScript-only: - path: ./plugins/my-plugin.js
#                      OR - js: ./plugins/my-plugin.js
#   2. Python-only:    - py: ./plugins/my_handler.py
#   3. Paired:         - id: my-plugin
#                        js: ./plugins/my-plugin.js
#                        py: ./plugins/my_handler.py
#
# See docs/how-to/create-feature-plugins.md for complete plugin development guide.
#
# To test the plugin system with the example poll node:
# 1. Uncomment the plugins section below
# 2. Set an API key: export ANTHROPIC_API_KEY=sk-ant-...
# 3. Normal mode: pixi run python -m canvas_chat launch --config config.example.yaml --port 7865
#    OR Admin mode: pixi run python -m canvas_chat launch --config config.example.yaml --admin-mode --port 7865
# 4. In browser console: app.createAndAddNode('poll', '', {data: {question: 'Favorite?', options: ['A', 'B']}})

plugins:
    # Example 1: JavaScript-only plugin (custom node type)
    # - path: ./src/canvas_chat/static/js/example-plugins/poll.js
    # OR
    # - js: ./src/canvas_chat/static/js/example-plugins/poll.js

    # Example 2: Paired plugin (JavaScript + Python)
    # - id: my-plugin
    #   js: ./plugins/my-feature.js
    #   py: ./plugins/my_handler.py

    # Example 3: Python-only plugin (backend handler)
    # - py: ./plugins/my_backend_handler.py

    # Example 4: Agent-backed feature plugin (uses agent architecture)
    # - path: ./src/canvas_chat/static/js/example-plugins/example-agent-plugin.js

    # Example 5: Minimal agent plugin (simplest agent pattern)
    # - path: ./src/canvas_chat/static/js/example-plugins/example-minimal-agent.js

    # Add your custom plugins here:
    # - path: ./plugins/my-custom-node.js
    # - path: /absolute/path/to/plugin.js

# ============================================================================
# AGENTS - Define agent behaviors for complex workflows
# ============================================================================
#
# Optional. Agents are declarative specifications describing what an agent is
# and what it is allowed to do. They enable complex workflows like delegation,
# research, and synthesis while keeping execution traceable in the DAG.
#
# Key concepts:
# - Base Agent: User-facing, owns the response, may delegate to sub-agents
# - Sub-Agents: Workers with narrower scope, invoked by base agent
# - Engine: Execution strategy (built-in, or custom adapters)
# - Budgets: Token/tool/time limits for execution
# - HITL: Human-in-the-loop policies for approvals
#
# See docs/explanation/agent-architecture.md for design details.

agents:
    # Example 1: Reflection agent (config-based, replaces built-in ReflectFeature)
    # This agent analyzes conversation branches and synthesizes insights
    - id: reflection-agent
      name: Reflection Agent
      slashCommand: /reflect-config  # Use different command to not conflict with built-in
      engine: agentic
      model: ''  # Uses default model from model picker
      systemPrompt: |
        You are analyzing a conversation thread to produce insights and summaries.
        You will be given a path through a conversation (from a branch point to subsequent leaves).
        Synthesize what you learn about the direction the conversation took.

        Provide a concise synthesis (2-3 paragraphs) that:
        1. Summarizes the key direction/theme of this conversation branch
        2. Notes what was learned or decided
        3. Relates it to any previous reflections if available
        4. Highlights any interesting patterns or insights
      allowedTools:
        - graph:findPathToRoot
        - graph:getNodeContent
        - graph:getPathContent
      budgets:
        maxTokens: 1000
        maxToolCalls: 10
        timeoutMs: 30000
      hitl:
        requireToolApproval: false
        requireMutationApproval: false
      defaultOutputNodeType: reflection
      outputMode: single_node
      # Data-driven display config - customize how output nodes appear
      outputDisplay:
        typeLabel: Reflection
        typeIcon: 🔮
        actions:
          - reply
          - copy
      # Post-create hooks - automatic graph operations after artifact creation
      # This enables declarative edge creation and metadata updates.
      #
      # Variable references:
      #   $artifact - The artifact node just created by this agent
      #   $source   - Each source node that triggered the run (expands to multiple)
      #   $branch   - The branch point node (requires usePathContext: true)
      #   $leaf     - The leaf node (requires usePathContext: true)
      #
      # Edge types: reply, run_reflection, run_artifact, run_trigger, subagent
      postCreate:
        usePathContext: true  # Required to resolve $branch and $leaf
        edges:
          - from: $branch
            to: $artifact
            edgeType: run_reflection
          - from: $leaf
            to: $artifact
            edgeType: run_reflection
        metadataUpdates:
          - target: $branch
            metadata:
              reflectionNodeIds: [$artifact]  # Arrays are appended
          - target: $leaf
            metadata:
              reflectionNodeIds: [$artifact]

    # Example 2: Simple research agent with slash command
    # - id: research-agent
    #   name: Research Assistant
    #   slashCommand: /research-config
    #   engine: built-in
    #   model: openai/gpt-4o
    #   systemPrompt: |
    #     You are a research assistant. When asked about a topic:
    #     1. Create a plan for researching the topic
    #     2. Use available tools to gather information
    #     3. Synthesize findings into a comprehensive summary
    #   allowedTools:
    #     - web_search
    #     - fetch_url
    #   budgets:
    #     maxTokens: 100000
    #     maxToolCalls: 30
    #     timeoutMs: 300000
    #   hitl:
    #     requireToolApproval: false
    #     requireMutationApproval: true

    # Example 2b: Agent using MCP tools (requires mcpServers config below)
    # This demonstrates how agents can use tools from configured MCP servers.
    # MCP tools use the format: mcp:server-name/tool-name
    # - id: git-assistant
    #   name: Git Assistant
    #   slashCommand: /git-agent
    #   engine: built-in
    #   model: openai/gpt-4o
    #   systemPrompt: |
    #     You are a git assistant that helps users explore their repository.
    #     Use the available git tools to inspect commits, branches, and file history.
    #     Provide clear summaries of what you find.
    #   allowedTools:
    #     - mcp:git/git_status          # Tools from the 'git' MCP server
    #     - mcp:git/git_log
    #     - mcp:git/git_diff
    #     - mcp:git/git_show
    #     - mcp:filesystem/read_file    # Can mix MCP servers
    #     - fetch_url                   # Can also use built-in tools
    #   budgets:
    #     maxTokens: 50000
    #     maxToolCalls: 20
    #     timeoutMs: 120000
    #   hitl:
    #     requireToolApproval: true    # Approve git operations
    #     autoApproveTools:
    #       - mcp:git/git_status       # Auto-approve read-only operations
    #       - mcp:git/git_log

    # Example 3: Supervisor with sub-agents
    # - id: supervisor
    #   name: Task Supervisor
    #   engine: built-in
    #   model: anthropic/claude-sonnet-4-20250514
    #   systemPrompt: |
    #     You are a task supervisor that coordinates specialized workers.
    #     Delegate research tasks to the retriever sub-agent.
    #     Delegate summarization to the summarizer sub-agent.
    #     Synthesize their outputs into a final response.
    #   allowedTools: []
    #   budgets:
    #     maxTokens: 150000
    #     maxToolCalls: 10
    #     timeoutMs: 600000
